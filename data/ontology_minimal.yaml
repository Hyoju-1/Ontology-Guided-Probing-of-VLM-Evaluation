frames:
  frame_on:
    name: "on"
    definition: "A is on the surface of B with contact."
    paraphrases:
      - "A rests on B"
      - "A is located on B"
    inverse_frame_id: "frame_under"
    confusing_frame_ids:
      - "frame_in"
    typed_examples:
      - "(person, on, chair)"
      - "(book, on, table)"
    role_descriptions:
      - "subject: entity supported by object"
      - "object: supporting surface/entity"

  frame_under:
    name: "under"
    definition: "A is below B, typically with vertical separation."
    paraphrases:
      - "A is beneath B"
      - "A is below B"
    inverse_frame_id: "frame_on"
    confusing_frame_ids:
      - "frame_around"
    typed_examples:
      - "(cat, under, table)"
      - "(box, under, shelf)"
    role_descriptions:
      - "subject: lower entity"
      - "object: upper entity"

  frame_in:
    name: "in"
    definition: "A is inside B and bounded by B."
    paraphrases:
      - "A is within B"
      - "A is contained in B"
    inverse_frame_id: "frame_around"
    confusing_frame_ids:
      - "frame_on"
    typed_examples:
      - "(book, in, box)"
      - "(fruit, in, bowl)"
    role_descriptions:
      - "subject: contained entity"
      - "object: container entity"

  frame_around:
    name: "around"
    definition: "A surrounds or contains B."
    paraphrases:
      - "A encloses B"
      - "A contains B"
    inverse_frame_id: "frame_in"
    confusing_frame_ids:
      - "frame_under"
    typed_examples:
      - "(box, around, book)"
      - "(bowl, around, fruit)"
    role_descriptions:
      - "subject: container entity"
      - "object: contained entity"

  frame_holding:
    name: "holding"
    definition: "A is physically holding or grasping B."
    paraphrases:
      - "A grasps B"
      - "A keeps B in hand"
    inverse_frame_id: null
    confusing_frame_ids:
      - "frame_on"
    typed_examples:
      - "(person, holding, cup)"
      - "(child, holding, toy)"
    role_descriptions:
      - "subject: holder/agent"
      - "object: held item"

roles:
  role_subject:
    name: "subject"
    definition: "Primary entity in the relation expression."
    paraphrases:
      - "main entity"
      - "first argument"
    inverse_role_id: "role_object"
    confusing_role_ids:
      - "role_container"
    applicable_frame_ids:
      - "frame_on"
      - "frame_under"
      - "frame_in"
      - "frame_around"
      - "frame_holding"
    role_descriptions:
      - "Usually the first argument in (subject, predicate, object)."
    typed_examples:
      - "person in (person, holding, cup)"
      - "book in (book, in, box)"

  role_object:
    name: "object"
    definition: "Secondary entity in the relation expression."
    paraphrases:
      - "target entity"
      - "second argument"
    inverse_role_id: "role_subject"
    confusing_role_ids:
      - "role_contained"
    applicable_frame_ids:
      - "frame_on"
      - "frame_under"
      - "frame_in"
      - "frame_around"
      - "frame_holding"
    role_descriptions:
      - "Usually the second argument in (subject, predicate, object)."
    typed_examples:
      - "cup in (person, holding, cup)"
      - "box in (book, in, box)"

  role_container:
    name: "container"
    definition: "Entity that contains or surrounds another entity."
    paraphrases:
      - "enclosing entity"
      - "holder space"
    inverse_role_id: "role_contained"
    confusing_role_ids:
      - "role_object"
    applicable_frame_ids:
      - "frame_around"
      - "frame_in"
    role_descriptions:
      - "Acts as outer boundary in containment relations."
    typed_examples:
      - "box in (box, around, book)"
      - "bowl in (bowl, around, fruit)"

  role_contained:
    name: "contained"
    definition: "Entity that is inside a container."
    paraphrases:
      - "inner entity"
      - "contained object"
    inverse_role_id: "role_container"
    confusing_role_ids:
      - "role_subject"
    applicable_frame_ids:
      - "frame_in"
      - "frame_around"
    role_descriptions:
      - "Occupies interior space of the container."
    typed_examples:
      - "book in (book, in, box)"
      - "fruit in (fruit, in, bowl)"

typed_tuples:
  tuple_person_on_chair:
    subject_type: "person"
    predicate: "on"
    object_type: "chair"
    name: "person_on_chair"
    definition: "A person is on a chair."
    paraphrases:
      - "person sitting on chair"
    swapped_tuple_id: "tuple_chair_on_person"
    inverse_tuple_ids:
      - "tuple_chair_under_person"
    confusing_tuple_ids:
      - "tuple_person_under_chair"
    typed_examples:
      - "A person sits on a wooden chair."
    role_descriptions:
      - "subject=person, object=chair"

  tuple_chair_on_person:
    subject_type: "chair"
    predicate: "on"
    object_type: "person"
    name: "chair_on_person"
    definition: "A chair is on a person."
    paraphrases:
      - "chair placed on person"
    swapped_tuple_id: "tuple_person_on_chair"
    inverse_tuple_ids: []
    confusing_tuple_ids:
      - "tuple_chair_under_person"
    typed_examples:
      - "A chair falls onto a person."
    role_descriptions:
      - "subject=chair, object=person"

  tuple_chair_under_person:
    subject_type: "chair"
    predicate: "under"
    object_type: "person"
    name: "chair_under_person"
    definition: "A chair is under a person."
    paraphrases:
      - "person is above chair"
    swapped_tuple_id: "tuple_person_under_chair"
    inverse_tuple_ids:
      - "tuple_person_on_chair"
    confusing_tuple_ids:
      - "tuple_chair_on_person"
    typed_examples:
      - "A chair supports a seated person from below."
    role_descriptions:
      - "subject=chair, object=person"

  tuple_person_under_chair:
    subject_type: "person"
    predicate: "under"
    object_type: "chair"
    name: "person_under_chair"
    definition: "A person is under a chair."
    paraphrases:
      - "person below chair"
    swapped_tuple_id: "tuple_chair_under_person"
    inverse_tuple_ids: []
    confusing_tuple_ids:
      - "tuple_person_on_chair"
    typed_examples:
      - "A person crouches under a raised chair."
    role_descriptions:
      - "subject=person, object=chair"

  tuple_book_in_box:
    subject_type: "book"
    predicate: "in"
    object_type: "box"
    name: "book_in_box"
    definition: "A book is in a box."
    paraphrases:
      - "book inside box"
    swapped_tuple_id: "tuple_box_in_book"
    inverse_tuple_ids:
      - "tuple_box_around_book"
    confusing_tuple_ids:
      - "tuple_book_around_box"
    typed_examples:
      - "A novel is stored in a paper box."
    role_descriptions:
