  tuple_box_in_book:
    subject_type: "box"
    predicate: "in"
    object_type: "book"
    name: "box_in_book"
    definition: "A box is in a book."
    paraphrases:
      - "box inside book cavity"
    swapped_tuple_id: "tuple_book_in_box"
    inverse_tuple_ids: []
    confusing_tuple_ids:
      - "tuple_box_around_book"
    typed_examples:
      - "A tiny box is hidden in a hollowed book."
    role_descriptions:
      - "subject=box, object=book"

  tuple_box_around_book:
    subject_type: "box"
    predicate: "around"
    object_type: "book"
    name: "box_around_book"
    definition: "A box surrounds a book."
    paraphrases:
      - "box contains book"
    swapped_tuple_id: "tuple_book_around_box"
    inverse_tuple_ids:
      - "tuple_book_in_box"
    confusing_tuple_ids:
      - "tuple_box_in_book"
    typed_examples:
      - "A gift box encloses a book."
    role_descriptions:
      - "subject=box, object=book"

  tuple_book_around_box:
    subject_type: "book"
    predicate: "around"
    object_type: "box"
    name: "book_around_box"
    definition: "A book surrounds a box."
    paraphrases:
      - "book wrapping around box"
    swapped_tuple_id: "tuple_box_around_book"
    inverse_tuple_ids: []
    confusing_tuple_ids:
      - "tuple_book_in_box"
    typed_examples:
      - "A folded book cover wraps a small box."
    role_descriptions:
      - "subject=book, object=box"

  tuple_person_holding_cup:
    subject_type: "person"
    predicate: "holding"
    object_type: "cup"
    name: "person_holding_cup"
    definition: "A person is holding a cup."
    paraphrases:
      - "person grasps cup"
    swapped_tuple_id: "tuple_cup_holding_person"
    inverse_tuple_ids: []
    confusing_tuple_ids:
